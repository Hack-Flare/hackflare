{% extends "base.html" %} {% block title %}Reset password — Hackflare{% endblock
%} {% block content %}
<div class="auth-page">
  <div class="auth-grid-bg"></div>
  <div class="auth-card">
    <a class="auth-brand" href="/"
      ><img
        class="brand-logo brand-logo-light"
        src="/static/brand/logos/logo-primary.svg"
        width="126"
        height="32"
        alt="Hackflare"
      /><img
        class="brand-logo brand-logo-dark"
        src="/static/brand/logos/logo-primary-reversed.svg"
        width="126"
        height="32"
        alt="Hackflare"
      /></a
    >
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Choose a new password</h2>
        <p class="card-desc">Enter a new password for your account</p>
      </div>
      <div class="card-content">
        {% if let Some(error) = error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form
          method="post"
          action="/reset-password?token={{ token }}"
          class="flex flex-col"
        >
          <div class="form-field">
            <label class="label" for="password">New password</label>
            <input
              class="input"
              id="password"
              name="password"
              type="password"
              placeholder="At least 8 characters"
              minlength="8"
              required
            />
          </div>
          <div class="form-field">
            <label class="label" for="password_confirm">Confirm password</label>
            <input
              class="input"
              id="password_confirm"
              name="password_confirm"
              type="password"
              placeholder="Confirm password"
              required
            />
          </div>
          <button class="btn btn-orange btn-block" type="submit">
            Reset password
          </button>
        </form>

        <p class="auth-note text-muted">
          <a class="auth-link" href="/login">← Back to sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
