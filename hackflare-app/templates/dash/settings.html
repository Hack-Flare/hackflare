<div class="dash-page">
  <h1>Settings</h1>
  <p class="dash-sub">Account, API keys, and password</p>
  <div class="card card-spaced">
    <div class="card-header"><h3 class="card-title">Password</h3></div>
    <div class="card-content">
      <form method="post" action="/dash/settings" class="flex flex-wrap gap-2">
        <input type="hidden" name="action" value="password" /><input
          class="input"
          name="current_password"
          type="password"
          placeholder="Current password"
        /><input
          class="input"
          name="new_password"
          type="password"
          placeholder="New password"
          required
        /><input
          class="input"
          name="confirm_password"
          type="password"
          placeholder="Confirm password"
          required
        /><button class="btn btn-orange" type="submit">Update Password</button>
      </form>
    </div>
  </div>
  <div class="card card-spaced">
    <div class="card-header"><h3 class="card-title">API Keys</h3></div>
    <div class="card-content">
      {% for key in keys %}
      <div class="quicklink">
        <strong>{{ key.name }}</strong><span>{{ key.prefix }}...</span>
      </div>
      {% else %}
      <p class="text-muted">No API keys yet.</p>
      {% endfor %}
    </div>
  </div>
</div>
