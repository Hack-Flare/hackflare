<div class="dash-page">
  <h1>Notifications</h1>
  <p class="dash-sub">Stay updated on your domains and account</p>
  <form method="post" action="/dash/notifications">
    <input type="hidden" name="action" value="all" /><button
      class="btn btn-outline"
      type="submit"
    >
      Mark all read
    </button>
  </form>
  <div class="card-spaced flex flex-col gap-3">
    {% for notification in notifications %}
    <div class="card p-4">
      <h3 class="font-semibold">{{ notification.title }}</h3>
      <p class="text-sm text-muted">{{ notification.message }}</p>
      <p class="text-xs text-muted">{{ notification.created_at }}</p>
    </div>
    {% else %}
    <div class="card p-12 text-center text-muted">No notifications yet.</div>
    {% endfor %}
  </div>
</div>
