<header class="site-header">
  <div class="container site-header-inner">
    <a class="brand" href="/" aria-label="Hackflare home"
      ><img
        class="brand-logo brand-logo-light"
        src="/static/brand/logos/logo-primary.svg"
        width="118"
        height="30"
        alt="Hackflare"
      /><img
        class="brand-logo brand-logo-dark"
        src="/static/brand/logos/logo-primary-reversed.svg"
        width="118"
        height="30"
        alt="Hackflare"
      /></a
    >
    <nav class="site-nav" id="site-nav">
      <a href="/#features">Features</a>
      <a href="/#how-it-works">How it works</a>
      <a href="/docs">Docs</a>
      <a href="https://github.com/Hack-Flare/hackflare"
        ><span class="lucide-icon icon-github" aria-hidden="true"></span>GitHub</a
      >
    </nav>
    <div class="site-actions">
      <a
        class="theme-toggle theme-toggle-dark"
        href="/theme?theme=dark"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      ><span class="lucide-icon icon-moon" aria-hidden="true"></span></a>
      <a
        class="theme-toggle theme-toggle-light"
        href="/theme?theme=light"
        aria-label="Switch to light mode"
        title="Switch to light mode"
      ><span class="lucide-icon icon-sun" aria-hidden="true"></span></a>
      <a class="site-link-secondary" href="/login">Sign in</a>
      <a class="btn btn-orange" href="/dash">Get started</a>
    </div>
  </div>
</header>
