[package]
name = "hackflare-app"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-client-ip = "1.3.1"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
derive_more = { version = "2.1.1", features = ["display", "error"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hackflare-dns = { path = "../hackflare_dns" }
hickory-proto = "0.26"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
percent-encoding = "2.3.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.22.0", features = ["chrono_0_4"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "ipnet", "uuid", "migrate", "derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
pg-embed = "1.0"
tower = "0.5"
