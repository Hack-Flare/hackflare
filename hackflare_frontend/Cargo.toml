[package]
name = "hackflare_frontend"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]

# Web framework + templating
axum = "0.8.9"
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }

## Async runtime
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

# Serialization / types
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
percent-encoding = "2.3.1"

# Misc
anyhow = "1.0.104"
dotenvy = "0.15.7"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }