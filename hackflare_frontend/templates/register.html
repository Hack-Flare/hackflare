{% extends "base.html" %} {% block title %}Create an account — HackFlare{%
endblock %} {% block content %}
<div class="auth-page">
  <div class="auth-grid-bg"></div>
  <div class="auth-card">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Create an account</h2>
        <p class="card-desc">Sign up for a HackFlare account</p>
      </div>
      <div class="card-content">
        {% if let Some(error) = error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register" class="flex flex-col">
          <div class="grid grid-cols-2 gap-3">
            <div class="form-field">
              <label class="label" for="first_name">First name</label>
              <input
                class="input"
                id="first_name"
                name="first_name"
                placeholder="First"
                value="{{ first_name }}"
                required
              />
            </div>
            <div class="form-field">
              <label class="label" for="last_name">Last name</label>
              <input
                class="input"
                id="last_name"
                name="last_name"
                placeholder="Last"
                value="{{ last_name }}"
                required
              />
            </div>
          </div>
          <div class="form-field">
            <label class="label" for="email">Email</label>
            <input
              class="input"
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              value="{{ email }}"
              required
            />
          </div>
          <div class="form-field">
            <label class="label" for="password">Password</label>
            <input
              class="input"
              id="password"
              name="password"
              type="password"
              placeholder="At least 8 characters"
              minlength="8"
              required
            />
          </div>
          <button class="btn btn-orange btn-block" type="submit">
            Create account
          </button>
        </form>

        <p class="auth-note text-muted">
          Already have an account?
          <a class="auth-link" href="/login">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
