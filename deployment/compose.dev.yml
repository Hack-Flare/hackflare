services:
  app:
    build:
      context: ../
      dockerfile: hackflare-app/Dockerfile
    env_file:
      - ../.env
    environment:
      - RUST_LOG=debug,hackflare=trace
    ports:
      - "3000:3000"
      - "53:5353/udp"
      - "53:5353/tcp"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:18
    shm_size: 256mb
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackflare"]
      interval: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  #pgadmin4:
  #  image: dpage/pgadmin4
