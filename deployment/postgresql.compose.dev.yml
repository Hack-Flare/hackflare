services:
  postgres:
    image: postgres:18
    shm_size: 256mb
    environment:
      POSTGRES_USER: hackflare
      POSTGRES_PASSWORD: hackflare
      POSTGRES_DB: hackflare
    ports:
      - "5432:5432"
    volumes:
      - hackflare-postgres-dev:/var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackflare -d hackflare"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  hackflare-postgres-dev:
