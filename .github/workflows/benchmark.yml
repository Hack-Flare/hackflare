name: Benchmark

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      users:
        description: "Comma separated user counts to benchmark"
        required: false
        default: "10,100,1000"
      duration-secs:
        description: "Seconds to run each scale"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-rust-cache

      - name: Build release binary
        run: cargo build --release -p hackflare-app --bin hackflare-app

      - name: Determine user counts
        run: |
          USERS="${{ github.event.inputs.users || '10,100,1000' }}"
          echo "USERS=$USERS" >> "$GITHUB_ENV"

      - name: Run benchmarks at each scale
        run: |
          IFS=',' read -ra SCALES <<< "$USERS"
          for users in "${SCALES[@]}"; do
            echo "=== benchmarking with $users users ==="
            cargo run -p hackflare-bench --release -- \
              --binary target/release/hackflare-app \
              --dev \
              --users "$users" \
              --duration-secs "${{ github.event.inputs.duration-secs || 30 }}" \
              --ramp-up-secs 10 \
              --output-dir "bench-results-$users"
          done

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: hackflare-bench-reports
          path: bench-results-*/
          retention-days: 30

      - name: Generate combined summary
        run: |
          SCALE_DIRS=$(ls -d bench-results-* 2>/dev/null | tr '\n' ' ')
          if [ -n "$SCALE_DIRS" ]; then
            cargo run -p hackflare-bench --release -- --summary $SCALE_DIRS --summary-output summary.md
          fi

      - name: Upload benchmark summary
        uses: actions/upload-artifact@v4
        with:
          name: hackflare-bench-summary
          path: summary.md
          retention-days: 30
