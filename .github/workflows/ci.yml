name: CI

on:
  push:
    paths:
      - "hackflare-app/**"
      - "hackflare-dns/**"
      - "hackflare-bench/**"
      - "database/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "hackflare-app/**"
      - "hackflare-dns/**"
      - "hackflare-bench/**"
      - "database/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "!**/*.md"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: true
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hackflare
          POSTGRES_USER: hackflare
          POSTGRES_DB: hackflare
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup sqlx-cli
        uses: ./.github/actions/setup-sqlx-cli

      # Check formatting first
      - name: Check formatting
        id: fmt
        run: |
          start=$(date +%s%N)
          status=0
          cargo fmt --all --check || status=$?
          end=$(date +%s%N)
          echo "duration_ms=$(( (end - start) / 1000000 ))" >> "$GITHUB_OUTPUT"
          exit $status
        continue-on-error: true

      # Clippy handles what cargo check does
      - name: Clippy
        id: clippy  
        run: |
          start=$(date +%s%N)
          status=0
          cargo clippy --all-targets --all-features -- -D warnings || status=$?
          end=$(date +%s%N)
          echo "duration_ms=$(( (end - start) / 1000000 ))" >> "$GITHUB_OUTPUT"
          exit $status
        continue-on-error: true

      - name: Run migrations
        id: migrations  
        run: |
          start=$(date +%s%N)
          status=0
          cargo sqlx migrate run --source database/migrations || status=$?
          end=$(date +%s%N)
          echo "duration_ms=$(( (end - start) / 1000000 ))" >> "$GITHUB_OUTPUT"
          exit $status
        env:
          DATABASE_URL: postgres://hackflare:hackflare@localhost:5432/hackflare
          SQLX_OFFLINE: false
        continue-on-error: true

      - name: Check offline query files
        id: sqlx_check
        run: |
          start=$(date +%s%N)
          status=0
          cargo sqlx prepare --check --workspace || status=$?
          end=$(date +%s%N)
          echo "duration_ms=$(( (end - start) / 1000000 ))" >> "$GITHUB_OUTPUT"
          exit $status
        env:
          DATABASE_URL: postgres://hackflare:hackflare@localhost:5432/hackflare
          SQLX_OFFLINE: false
          SQLX_OFFLINE_DIR: database/.sqlx
        continue-on-error: true

      - name: Run tests
        id: tests
        run: |
          start=$(date +%s%N)
          status=0

          DATABASE_URL=postgres://hackflare:hackflare@localhost:5432/hackflare \
            cargo test -p hackflare-app --all-features -- --test-threads=1 || status=$?
          DATABASE_URL=postgres://hackflare:hackflare@localhost:5432/hackflare \
            cargo test -p hackflare-dns --all-features -- --test-threads=1 || status=$?

          cargo test -p hackflare-bench --all-features || status=$?
          end=$(date +%s%N)
          echo "duration_ms=$(( (end - start) / 1000000 ))" >> "$GITHUB_OUTPUT"
          exit $status
        continue-on-error: true

      - name: Count Lines of Code
        uses: ./.github/actions/loc-counter
        continue-on-error: true

      - name: Generate CI Summary
        if: always()
        uses: ./.github/actions/CI-summary
        with:
          output-file: 'ci-summary.md'
          fmt: ${{ steps.fmt.outcome }}
          fmt-time: ${{ steps.fmt.outputs.duration_ms }}
          clippy: ${{ steps.clippy.outcome }}
          clippy-time: ${{ steps.clippy.outputs.duration_ms }}
          migrations: ${{ steps.migrations.outcome }}
          migrations-time: ${{ steps.migrations.outputs.duration_ms }}
          sqlx_check: ${{ steps.sqlx_check.outcome }}
          sqlx_check-time: ${{ steps.sqlx_check.outputs.duration_ms }}
          tests: ${{ steps.tests.outcome }}
          tests-time: ${{ steps.tests.outputs.duration_ms }}

      - name: Add lines of code to CI Summary
        if: always()
        run: |
          echo "## Total LOC" >> ci-summary.md
          echo "" >> ci-summary.md
          cat loc_output.txt >> ci-summary.md
        continue-on-error: true

      - name: Dump CI Summary
        if: always()
        uses: ./.github/actions/dump-summary
        with:
          file-path: 'ci-summary.md'

      - name: Pipeline Status enforcement
        if: always()
        run: |
          if [ "${{ steps.fmt.outcome }}" != "success" ] || \
             [ "${{ steps.clippy.outcome }}" != "success" ] || \
             [ "${{ steps.migrations.outcome }}" != "success" ] || \
             [ "${{ steps.sqlx_check.outcome }}" != "success" ] || \
             [ "${{ steps.tests.outcome }}" != "success" ]; then
             echo "Job failed due to one or more pipeline gates failing. Please check the CI summary for details."
             exit 1
          fi  

