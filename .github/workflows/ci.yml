name: CI

on:
  push:
    paths:
      - "hackflare-app/**"
      - "hackflare_dns/**"
      - "database/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "hackflare-app/**"
      - "hackflare_dns/**"
      - "database/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: true
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hackflare
          POSTGRES_USER: hackflare
          POSTGRES_DB: hackflare
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-rust-cache

      - name: Cache sqlx-cli
        id: cache-sqlx-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-0.8.6-postgres-rustls

      - name: Install sqlx-cli
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true' 
        run: |
          cargo install sqlx-cli \
          --version 0.8.6 \
          --locked \
          --no-default-features \
          --features postgres,rustls

      # Check formatting first
      - name: Check formatting
        id: fmt
        run: cargo fmt --all --check
        continue-on-error: true

      # Clippy handles what cargo check does
      - name: Clippy
        id: clippy  
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Run migrations
        id: migrations  
        run: cargo sqlx migrate run --source database/migrations
        env:
          DATABASE_URL: postgres://hackflare:hackflare@localhost:5432/hackflare
          SQLX_OFFLINE: false
        continue-on-error: true

      - name: Check offline query files
        id: sqlx_check
        run: cargo sqlx prepare --check --workspace
        env:
          DATABASE_URL: postgres://hackflare:hackflare@localhost:5432/hackflare
          SQLX_OFFLINE: false
          SQLX_OFFLINE_DIR: database/.sqlx
        continue-on-error: true

      - name: Run tests
        id: tests
        run: cargo test --all-features
        continue-on-error: true

      - name: Generate CI Summary
        if: always()
        uses: ./.github/actions/CI-summary
        with:
          output-file: 'ci-summary.md'
          fmt: ${{ steps.fmt.outcome }}
          clippy: ${{ steps.clippy.outcome }}
          migrations: ${{ steps.migrations.outcome }}
          sqlx_check: ${{ steps.sqlx_check.outcome }}
          tests: ${{ steps.tests.outcome }}

      - name: Dump CI Summary
        if: always()
        uses: ./.github/actions/dump-summary
        with:
          file-path: 'ci-summary.md'

      - name: Pipeline Status enforcement
        if: always()
        run: |
          if [ "${{ steps.fmt.outcome }}" != "success" ] || \
             [ "${{ steps.clippy.outcome }}" != "success" ] || \
             [ "${{ steps.migrations.outcome }}" != "success" ] || \
             [ "${{ steps.sqlx_check.outcome }}" != "success" ] || \
             [ "${{ steps.tests.outcome }}" != "success" ]; then
             echo "Job failed due to one or more pipeline gates failing. Please check the CI summary for details."
             exit 1
          fi  

