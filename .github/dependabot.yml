version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/hackflare_api"
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      hackflare_app:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/hackflare_dns"
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      hackflare_dns:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      hackflare_frontend:
        patterns:
          - "*"
